################################################################################
# Open Green Energy Solar Powered WiFi Weather Station V4.0
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/u_oge_weatherstation_v4.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - ESP32 board/platform configuration
#   - I2C bus configuration
#   - sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/boards/esp32/u_oge_weatherstation_v4.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/esp32.html
# Reference: https://esphome.io/components/i2c.html
# Reference: https://esphome.io/components/sensor/index.html
# Reference: https://esphome.io/components/sensor/internal_temperature.html
# Reference: https://esphome.io/components/sensor/template.html
# ------------------------------------------------------------------------------
# Notes:
#     - Uses ESP-IDF.
#     - Removed the floating framework version pin.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Historical test only; current ESP-IDF retest pending
#     - Validation status: Needs validation
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
################################################################################
esp32:
  board: esp32dev
  framework:
    type: esp-idf

# I2C settings
i2c:
  id: ${device_internal_name}_i2c_bus0
  sda: GPIO21
  scl: GPIO22
  scan: true

# Sensors
sensor:
  # Internal Temperature Sensor
  - platform: internal_temperature
    id: ${device_internal_name}_internal_temperature
    name: Internal Temperature
    icon: mdi:coolant-temperature
    unit_of_measurement: °C
    device_class: temperature
    update_interval: ${device_sampling_time}
    disabled_by_default: true

  - platform: template
    id: ${device_internal_name}_internal_temperature_f
    name: Internal Temperature (F)
    icon: mdi:coolant-temperature
    unit_of_measurement: °F
    lambda: return id(${device_internal_name}_internal_temperature).state * 9/5+32;
    device_class: temperature
    update_interval: ${device_sampling_time}
    entity_category: diagnostic
    disabled_by_default: true
