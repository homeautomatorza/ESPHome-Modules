################################################################################
# HAZA Weather Station Board v1
################################################################################
# Usage:
#   Add the following code to the packages section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/haza_weather_station_v1.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - ESP32 board/platform configuration
#   - status LED configuration
#   - I2C bus configuration
#   - sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/boards/esp32/haza_weather_station_v1.yaml
# Version: 2026.0.1b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/esp32.html
# Reference: https://esphome.io/components/status_led.html
# Reference: https://esphome.io/components/i2c.html
# Reference: https://esphome.io/components/sensor/index.html
# Reference: https://esphome.io/components/sensor/internal_temperature.html
# Reference: https://esphome.io/components/sensor/template.html
# ------------------------------------------------------------------------------
# Notes:
#     - Dedicated package for Pascal's original HAZA weather station hardware.
#     - Uses the ESP32 DevKit style board and pin layout from the historical
#       flat weather station configuration.
#     - This is not the Open Green Energy weather station board package.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.0
#     - Recommended ESPHome: 2026.7.4 or newer
#     - Config validated: ESPHome 2026.7.3 and 2026.8 beta, Weather
#       Sense Basic, 2026-08-22
#     - Compile validated: ESPHome 2026.7.3 and 2026.8 beta, Weather
#       Sense Basic, 2026-08-22
#     - Hardware validated: Weather Sense Basic serial upload, logs,
#       web, BME280 and DS18B20, 2026-08-22
#     - Validation status: Partial hardware validation; corrected LTR390
#       and battery calibration pending
#     - Evidence:
#       recipes/projects/weather_sense/basic/documents/validation.md
# ------------------------------------------------------------------------------
# Spec:
#     - Not recorded; consult the board reference before wiring.
# ------------------------------------------------------------------------------
# WARNING:
# This code carries an "It works on my setup" disclaimer.
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
################################################################################
esp32:
  board: esp32dev
  framework:
    type: esp-idf

status_led:
  id: ${device_internal_name}_status_led
  pin:
    number: GPIO2
    inverted: false

i2c:
  id: ${device_internal_name}_i2c_bus0
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: internal_temperature
    id: ${device_internal_name}_internal_temperature
    name: Internal Temperature
    icon: mdi:coolant-temperature
    unit_of_measurement: °C
    device_class: temperature
    update_interval: ${device_sampling_time}
    disabled_by_default: true

  - platform: template
    id: ${device_internal_name}_internal_temperature_f
    name: Internal Temperature (F)
    icon: mdi:coolant-temperature
    unit_of_measurement: °F
    lambda: return id(${device_internal_name}_internal_temperature).state * 9/5+32;
    device_class: temperature
    update_interval: ${device_sampling_time}
    entity_category: diagnostic
    disabled_by_default: true
