################################################################################
# Espressif ESP32-C3-MINI-1
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/c3_mini_espressif.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - ESP32 board/platform configuration
#   - light entities
#   - I2C bus configuration
#   - UART bus configuration
#   - SPI bus configuration
#   - sensor entities
#   - text sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/boards/esp32/c3_mini_espressif.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/esp32.html
# Reference: https://esphome.io/components/light/index.html
# Reference: https://esphome.io/components/light/esp32_rmt_led_strip.html
# Reference: https://esphome.io/components/i2c.html
# Reference: https://esphome.io/components/uart.html
# Reference: https://esphome.io/components/spi.html
# Reference: https://esphome.io/components/sensor/index.html
# Reference: https://esphome.io/components/sensor/internal_temperature.html
# Reference: https://esphome.io/components/sensor/template.html
# Reference: https://esphome.io/components/text_sensor/index.html
# Reference: https://esphome.io/components/text_sensor/template.html
# ------------------------------------------------------------------------------
# Notes:
#     - Migrated from Arduino to ESP-IDF.
#     - GPIO8 and GPIO2 are strapping pins; verify attached hardware before boot.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet on the ESP-IDF migration
#     - Validation status: Needs validation
# ------------------------------------------------------------------------------
# Reference: https://docs.espressif.com/projects/arduino-esp32/en/latest/boards/ESP32-C3-DevKitM-1.html
# Spec:
#     - ESP32-C3FN4 RISCV Single Core
#     - 2.4 GHz Wi­Fi (802.11 b/g/n) and Bluetooth 5 module
#     - 4 MB flash
#     - 1 × I2C
#     - 1 × I2S
#     - 3 x SPI
#     - 2 x UART
#     - 2 × 12-bit SAR ADC
#     - 1 x RGB LED
#     - 1 x Internal Temperature Sensor
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
################################################################################
esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y

# Internal LEDs
light:
  - platform: esp32_rmt_led_strip
    id: ${device_internal_name}_onboard_rgb_led
    name: Onboard RGB LED
    icon: mdi:led-outline
    channel_colors: GRB
    pin: GPIO8
    num_leds: 1
    chipset: ws2812
    entity_category: config
    disabled_by_default: true

# I2C settings
i2c:
  id: ${device_internal_name}_i2c
  sda: GPIO3
  scl: GPIO2
  scan: true

# UART
uart:
  id: ${device_internal_name}_uart_bus0
  tx_pin: GPIO21
  rx_pin: GPIO20
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

# SPI
spi:
  id: ${device_internal_name}_spi_bus0
  clk_pin: GPIO0
  mosi_pin: GPIO1
  miso_pin: GPIO10
  interface: hardware

# Sensors
sensor:
  # Internal Temperature Sensor
  - platform: internal_temperature
    id: ${device_internal_name}_internal_temperature
    name: Internal Temperature
    icon: mdi:temperature-celsius
    device_class: temperature
    update_interval: ${device_sampling_time}
    disabled_by_default: true

  - platform: template
    id: ${device_internal_name}_internal_temperature_f
    name: Internal Temperature (F)
    icon: mdi:temperature-fahrenheit
    unit_of_measurement: °F
    lambda: return id(${device_internal_name}_internal_temperature).state * 9/5+32;
    device_class: temperature
    entity_category: diagnostic
    update_interval: ${device_sampling_time}
    disabled_by_default: true

# Board model for reference
text_sensor:
  - platform: template
    name: Board Model
    id: ${device_internal_name}_board
    lambda: |-
      return {"Espressif ESP32-C3-MINI-1"};
    icon: mdi:cpu-32-bit
    entity_category: diagnostic
    update_interval: ${device_sampling_time}
    disabled_by_default: true
