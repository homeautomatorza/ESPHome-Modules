################################################################################
# DFRobot FireBeetle 2 ESP32-C5 v1.0
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/c5_firebeetle_2.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - ESP32 board/platform configuration
#   - status LED configuration
#   - I2C bus configuration
#   - UART bus configuration
#   - SPI bus configuration
#   - sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/boards/esp32/c5_firebeetle_2.yaml
# Version: 2026.0.0
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://wiki.dfrobot.com/dfr1222/
# Reference: https://esphome.io/components/esp32.html
# Reference: https://esphome.io/components/status_led.html
# Reference: https://esphome.io/components/i2c.html
# Reference: https://esphome.io/components/uart.html
# Reference: https://esphome.io/components/spi.html
# Reference: https://esphome.io/components/sensor/index.html
# Reference: https://esphome.io/components/sensor/internal_temperature.html
# Reference: https://esphome.io/components/sensor/template.html
# ------------------------------------------------------------------------------
# Notes:
#       - No matching ESPHome board id is used yet. This package uses the
#         generic ESP32-C5 variant until a suitable board alias is available.
#       - The onboard LED shares GPIO15 with the DFRobot GDI LCD backlight.
#         Do not use the status LED package when a GDI display needs backlight
#         control.
#       - The 3V3_C rail is controlled by GPIO0 on this board and defaults off.
#         Enable it in the device project when powering external hardware from
#         that switched rail.
#       - ESP-IDF is intentionally not pinned. ESPHome selects the supported
#         framework version for the installed ESPHome release.
# ------------------------------------------------------------------------------
# Compatibility:
#       - Minimum ESPHome: 2026.7.3
#       - Recommended ESPHome: 2026.8.x beta or newer
#       - Config validated: ESPHome 2026.7.3 and 2026.8.0
#       - Compile validated: ESPHome 2026.7.3 and 2026.8.0
#       - Hardware validated: Bare-board bring-up, 2026-08-24
#       - Validation status: Passed compile, serial upload, log check, and web
#         check on a physical FireBeetle 2 ESP32-C5 with no external
#         peripherals attached. I2C, SPI, and UART are configured and visible in
#         boot logs, but external bus devices are not hardware-validated yet.
# ------------------------------------------------------------------------------
# Spec:
#       - ESP32-C5 RISC-V single-core processor
#       - 240 MHz CPU
#       - 4 MB flash
#       - 2.4 GHz and 5 GHz Wi-Fi
#       - Bluetooth 5 hardware capability
#       - IEEE 802.15.4 hardware capability for Thread/Zigbee
#       - 1 x onboard LED
#
# Confirmed onboard pins:
#       - LED / GDI LCD_BL: GPIO15
#       - BOOT: GPIO28
#       - I2C SDA: GPIO9
#       - I2C SCL: GPIO10
#       - UART TX: GPIO11
#       - UART RX: GPIO12
#       - SPI SCLK: GPIO23
#       - SPI MOSI: GPIO24
#       - SPI MISO: GPIO25
#       - 3V3_C control: GPIO0
#       - Battery voltage detection: GPIO1
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
################################################################################
esp32:
  variant: esp32c5
  cpu_frequency: 240MHz
  flash_size: 4MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_4MB: y # Ensures a 4MB flash size
      CONFIG_OPENTHREAD_ENABLED: n      # Disable Thread!
      CONFIG_ENABLE_WIFI_STATION: y     # Ensures the WiFi is up
      CONFIG_USE_MINIMAL_MDNS: y

# Status led
status_led:
  id: ${device_internal_name}_status_led
  pin:
    number: GPIO15
    inverted: false

# I2C settings
i2c:
  - id: ${device_internal_name}_i2c_bus0
    sda: GPIO9
    scl: GPIO10
    scan: true

# UART
uart:
  - id: ${device_internal_name}_uart_bus0
    tx_pin: GPIO11
    rx_pin: GPIO12
    baud_rate: 256000
    parity: NONE
    stop_bits: 1

# SPI
spi:
  - id: ${device_internal_name}_spi_bus0
    clk_pin: GPIO23
    mosi_pin: GPIO24
    miso_pin: GPIO25
    interface: hardware

# Sensors
sensor:
  # Internal Temperature Sensor
  - platform: internal_temperature
    id: ${device_internal_name}_internal_temperature
    name: "Internal Temperature"
    icon: mdi:temperature-celsius
    update_interval: ${device_sampling_time}
    disabled_by_default: true

  - platform: template
    id: ${device_internal_name}_internal_temperature_f
    name: Internal Temperature (F)
    icon: mdi:temperature-fahrenheit
    unit_of_measurement: °F
    lambda: return id(${device_internal_name}_internal_temperature).state * 9/5+32;
    device_class: temperature
    update_interval: ${device_sampling_time}
    entity_category: diagnostic
    disabled_by_default: true
