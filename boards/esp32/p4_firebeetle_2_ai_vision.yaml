################################################################################
# DFRobot FireBeetle 2 ESP32-P4 AI Vision Board
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   board: !include boards/esp32/p4_firebeetle_2_ai_vision.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - ESP32-P4 board/platform configuration
#   - status LED configuration
#   - I2C bus configuration
#   - UART bus configuration
#   - SPI bus configuration
#   - 32 MB PSRAM
#   - hosted ESP32-C6 SDIO wireless link
#   - onboard PDM microphone with software enable switch
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/boards/esp32/p4_firebeetle_2_ai_vision.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://wiki.dfrobot.com/dfr1172/
# Reference: https://www.dfrobot.com/product-2915.html
# Reference: https://esphome.io/components/esp32.html
# Reference: https://esphome.io/components/esp32_hosted.html
# Reference: https://esphome.io/components/i2c.html
# Reference: https://esphome.io/components/i2s_audio.html
# Reference: https://esphome.io/components/microphone/i2s_audio.html
# Reference: https://esphome.io/components/psram.html
# Reference: https://esphome.io/components/sensor/sound_level.html
# Reference: https://esphome.io/components/uart.html
# Reference: https://esphome.io/components/spi.html
# Reference: https://esphome.io/components/status_led.html
# ------------------------------------------------------------------------------
# Notes:
#     - This is the practical public board package for the FireBeetle 2 ESP32-P4
#       AI Vision Board.
#     - ESP32-P4 does not include native Wi-Fi or Bluetooth. Wi-Fi support
#       depends on the onboard ESP32-C6 co-processor and ESP-Hosted firmware.
#     - Bluetooth is intentionally not enabled in this package. ESP-Hosted BLE
#       rendered web entities during bring-up, but caused a repeatable runtime
#       crash loop on the tested board.
#     - Pascal's first hardware sample reports ESP-ROM esp32p4-eco2. This file
#       enables ESPHome's ESP32-P4 engineering-sample handling for that hardware.
#     - The onboard PDM microphone is enabled by default and exposes relative
#       RMS/peak sound-level indicators plus a software enable switch. If a
#       project does not need the microphone, remove or comment out the I2S
#       Audio Bus, Onboard PDM Microphone, Audio State, Audio Control, and Sound
#       Level Sensors sections together.
#     - MIPI CSI and MIPI DSI hardware are present on the board but not exposed
#       by this package yet.
#     - DFRobot exposes TX/RX on GPIO37/GPIO38. ESPHome warns that these are
#       strapping pins, so avoid external pull-up/down circuits on that UART.
#     - SPI pins use the header pinout labels: MI=GPIO30, MO=GPIO29, SCK=GPIO28.
#       Confirm these on hardware before marking the SPI bus hardware validated.
#     - ESP-IDF is intentionally not pinned. ESPHome selects the supported
#       framework version for the installed ESPHome release.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.3
#     - Recommended ESPHome: 2026.8.x beta or newer
#     - Config validated: ESPHome 2026.7.3 local CLI, 2026-08-24
#     - Compile validated: ESPHome 2026.7.3 local CLI, 2026-08-24
#     - Hardware validated: ESPHome 2026.8.0 serial upload, serial log, and web
#       checks for P4 core, PSRAM, hosted C6 Wi-Fi/network stack, and onboard
#       PDM microphone, 2026-08-24
#     - Validation status: Beta hardware-validated for core/network/audio
#       bring-up. Bluetooth is excluded until hosted C6 BLE runtime support is
#       stable on this board.
# ------------------------------------------------------------------------------
# Spec:
#     - ESP32-P4R32 RISC-V processor
#     - 16 MB flash
#     - 1 x onboard LED
#     - onboard ESP32-C6 co-processor for hosted Wi-Fi
#     - 32 MB PSRAM
#     - onboard PDM microphone
#
# Confirmed onboard pins:
#     - LED: GPIO3
#     - BOOT: GPIO35
#     - I2C SDA: GPIO7
#     - I2C SCL: GPIO8
#     - UART TX: GPIO37
#     - UART RX: GPIO38
#     - SPI SCK: GPIO28
#     - SPI MOSI: GPIO29
#     - SPI MISO: GPIO30
#     - ESP32-C6 SDIO D0: GPIO14
#     - ESP32-C6 SDIO D1: GPIO15
#     - ESP32-C6 SDIO D2: GPIO16
#     - ESP32-C6 SDIO D3: GPIO17
#     - ESP32-C6 SDIO CLK: GPIO18
#     - ESP32-C6 SDIO CMD: GPIO19
#     - ESP32-C6 EN: GPIO54
#     - ESP32-C6 WAKEUP: GPIO6
#     - PDM microphone CLK: GPIO12
#     - PDM microphone DATA: GPIO9
#
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
################################################################################
esp32:
  variant: esp32p4
  engineering_sample: true
  cpu_frequency: 360MHz
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESPTOOLPY_FLASHSIZE_16MB: y

esphome:
  build_flags:
    - -DBOARD_HAS_PSRAM

psram:
  mode: hex
  speed: 20MHz

esp32_hosted:
  type: sdio
  variant: ESP32C6
  reset_pin: GPIO54
  active_high: true
  clk_pin: GPIO18
  cmd_pin: GPIO19
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
  bus_width: 4
  sdio_frequency: 10MHz

# Status led
status_led:
  id: ${device_internal_name}_status_led
  pin:
    number: GPIO3
    inverted: false

# I2C settings
i2c:
  - id: ${device_internal_name}_i2c_bus0
    sda: GPIO7
    scl: GPIO8
    scan: true

# UART
uart:
  - id: ${device_internal_name}_uart_bus0
    tx_pin: GPIO37
    rx_pin: GPIO38
    baud_rate: 115200
    parity: NONE
    stop_bits: 1

# SPI
spi:
  - id: ${device_internal_name}_spi_bus0
    clk_pin: GPIO28
    mosi_pin: GPIO29
    miso_pin: GPIO30
    interface: hardware

################################################################################
# I2S Audio Bus
################################################################################
i2s_audio:
  - id: ${device_internal_name}_onboard_mic_i2s
    i2s_lrclk_pin: GPIO12

################################################################################
# Onboard PDM Microphone
################################################################################
microphone:
  - platform: i2s_audio
    id: ${device_internal_name}_onboard_pdm_microphone
    adc_type: external
    i2s_audio_id: ${device_internal_name}_onboard_mic_i2s
    i2s_din_pin: GPIO9
    pdm: true
    channel: right
    sample_rate: 16000
    bits_per_sample: 16bit

################################################################################
# Audio State
################################################################################
globals:
  - id: ${device_internal_name}_onboard_microphone_enabled
    type: bool
    restore_value: true
    initial_value: 'true'

################################################################################
# Audio Control
################################################################################
switch:
  - platform: template
    id: ${device_internal_name}_onboard_microphone_switch
    name: Onboard Microphone
    icon: mdi:microphone
    lambda: |-
      return id(${device_internal_name}_onboard_microphone_enabled);
    turn_on_action:
      - globals.set:
          id: ${device_internal_name}_onboard_microphone_enabled
          value: 'true'
      - lambda: |-
          id(${device_internal_name}_onboard_microphone_switch).publish_state(true);
      - sound_level.start:
          id: ${device_internal_name}_onboard_microphone_sound_level
    turn_off_action:
      - globals.set:
          id: ${device_internal_name}_onboard_microphone_enabled
          value: 'false'
      - lambda: |-
          id(${device_internal_name}_onboard_microphone_switch).publish_state(false);
      - sound_level.stop:
          id: ${device_internal_name}_onboard_microphone_sound_level
    web_server:
      sorting_weight: 1
      sorting_group_id: audio_group

################################################################################
# Sound Level Sensors
################################################################################
sensor:
  - platform: sound_level
    id: ${device_internal_name}_onboard_microphone_sound_level
    passive: false
    measurement_duration: 1000ms
    microphone:
      microphone: ${device_internal_name}_onboard_pdm_microphone
      bits_per_sample: 16
      channels: 0
      gain_factor: 1
    rms:
      id: ${device_internal_name}_onboard_microphone_rms
      name: Onboard Microphone RMS Level
      icon: mdi:microphone
      web_server:
        sorting_weight: 10
        sorting_group_id: audio_group
    peak:
      id: ${device_internal_name}_onboard_microphone_peak
      name: Onboard Microphone Peak Level
      icon: mdi:microphone
      web_server:
        sorting_weight: 11
        sorting_group_id: audio_group
