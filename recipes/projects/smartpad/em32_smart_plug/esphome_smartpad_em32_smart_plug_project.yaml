# WARNING:
# This code carries an "It works on my setup" disclaimer.
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.8.1
#     - Compile validated: ESPHome 2026.8.1
#     - Physical OTA validated: dedicated SmartPad EM32 development plug,
#       2026-08-26
#     - Log/API validated: dedicated SmartPad EM32 development plug, 2026-08-26
#     - Web UI validated: dedicated SmartPad EM32 development plug, 2026-08-26
#     - Full hardware validation: Relay, button, LEDs, metering calibration,
#       overload cutoff, and longer BLE stability still pending
#     - Validation status: OTA/web/log smoke validated; function tests pending
# ------------------------------------------------------------------------------
# Bill of Materials:
#     - Device:
#         - SmartPad EM32 ESP32-C3 energy monitoring smart plug
#     - Services:
#         - Wi-Fi
#         - Encrypted Home Assistant API
#         - OTA
#         - Web server
#         - Bluetooth proxy and BLE tracker
# ------------------------------------------------------------------------------
# References:
#     - https://github.com/Smartpadza/Device_Configs
#     - github://Smartpadza/Device_Configs/smartpad-em32-smart-plug.yaml
#     - https://esphome.io/components/sensor/hlw8012.html
#     - https://esphome.io/components/bluetooth_proxy.html
# ------------------------------------------------------------------------------
# Usage:
#   Compile this project from its recipe folder inside the repository. If you
#   copy only this YAML file into an ESPHome root folder, adjust the package
#   paths to match the new location before compiling.
# ------------------------------------------------------------------------------
# This project exposes:
#   - relay outlet switch
#   - physical power button
#   - voltage, current, power, energy, and daily energy sensors
#   - calibration number entities
#   - overload count diagnostic sensor
#   - standard Wi-Fi, API, OTA, web server, uptime, status, and diagnostic
#     entities from the shared framework packages
#   - Bluetooth proxy and BLE tracking from the shared framework package
################################################################################

################################################################################
# Substitutions
################################################################################
substitutions:
  device_internal_name: haza_smartpad_em32_smart_plug
  device_wifi_name: haza-smartpad-em32
  device_friendly_name: HAZA SmartPad EM32
  device_sampling_time: 10s
  device_timezone: Africa/Johannesburg

################################################################################
# Packages
################################################################################
packages:
  # Board package
  board: !include ../../../../boards/esp32/c3_basic.yaml

  # Core packages
  settings: !include ../../../../common/core/settings.yaml
  time: !include ../../../../common/time/home_assistant.yaml

  # Network packages
  wifi_base: !include ../../../../common/network/wifi.yaml
  wifi_dynamic: !include ../../../../common/network/wifi_dynamicip.yaml
  webserver: !include ../../../../common/network/webserver.yaml
  bluetooth: !include ../../../../common/network/bluetooth.yaml

  # Project-local package
  smartpad_em32: !include packages/em32_smart_plug.yaml

################################################################################
# ESPHome Overrides / Project Metadata
################################################################################
esphome:
  min_version: 2026.7.0
  comment: SmartPad EM32 framework migration scaffold

  project:
    name: haza.smartpad_em32_smart_plug
    version: 2026.0.0b

################################################################################
# Add Custom Local Logic
################################################################################
# SmartPad-specific logic lives in packages/em32_smart_plug.yaml until hardware
# testing shows which parts should become reusable framework packages.
