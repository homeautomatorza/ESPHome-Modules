################################################################################
# HAZA Room Sense Max Project - C6 Full Sensor Bring-Up
################################################################################
# Author: Pascal Parent
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/recipes/projects/room_sense/max/README.md
# Version: 2026.0.0
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# ------------------------------------------------------------------------------
# WARNING:
# This code carries an "It works on my setup" disclaimer.
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.0
#     - Recommended ESPHome: 2026.7.4 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3 and 2026.7.4, 2026-08-17
#     - Hardware validated: Room Sense Max validation device, 2026-08-17
#     - Validation status: Passed serial upload, OTA upload, log check, web
#       check, and combined sensor confirmation with ESPHome 2026.7.4.
# ------------------------------------------------------------------------------
# Bill of Materials For This Stage:
#     - Board:
#         - ESP32-C6 Super Mini
#     - Sensors:
#         - BH1750 illuminance sensor on I2C address 0x23
#         - BME280 temperature, humidity, pressure, and dew point sensor on
#           I2C address 0x76
#         - SGP30 eCO2 and TVOC sensor on I2C address 0x58
#         - SPS30 particulate matter sensor on I2C address 0x69
#         - HC-SR501 PIR movement sensor on GPIO1
#         - HLK-LD2410C presence sensor on UART TX GPIO3, RX GPIO4, and
#           presence GPIO0
# ------------------------------------------------------------------------------
# References:
#     - https://esphome.io/
#     - https://esphome.io/components/esp32.html
#     - https://esphome.io/components/sensor/bh1750.html
#     - https://esphome.io/components/sensor/bme280.html
#     - https://esphome.io/components/sensor/sgp30.html
#     - https://esphome.io/components/sensor/sps30.html
#     - https://esphome.io/components/binary_sensor/gpio.html
#     - https://esphome.io/components/sensor/ld2410.html
#     - https://esphome.io/components/uart.html
# ------------------------------------------------------------------------------
# This staged project exposes:
#   - BME280 temperature, humidity, atmospheric pressure, and dew point
#   - BH1750 illuminance and human-readable illuminance label
#   - SGP30 eCO2 and TVOC sensing with BME280 compensation
#   - SPS30 particulate matter sensing
#   - HC-SR501 PIR movement detection
#   - HLK-LD2410C mmWave presence detection
#   - combined occupancy state from PIR movement and LD2410C GPIO presence
#   - standard WiFi, API, OTA, web server, uptime, status, and diagnostic
#     entities from the shared framework packages
################################################################################

################################################################################
# Substitutions
################################################################################
substitutions:
  device_internal_name: haza_room_sense_max
  device_wifi_name: haza-room-sense-max
  device_friendly_name: HAZA Room Sense Max
  device_sampling_time: 30s

################################################################################
# Packages
################################################################################
packages:
  # Board package
  board: !include ../../../../boards/esp32/c6_super_mini.yaml

  # Core packages
  settings: !include ../../../../common/core/settings.yaml
  time: !include ../../../../common/time/home_assistant.yaml

  # Network packages
  wifi_base: !include ../../../../common/network/wifi.yaml
  wifi_dynamic: !include ../../../../common/network/wifi_dynamicip.yaml
  webserver: !include ../../../../common/network/webserver.yaml

  # Sensor packages
  bh1750: !include
    file: ../../../../sensors/i2c/bh1750.yaml
    vars:
      i2c_address: 0x23

  bme280: !include
    file: ../../../../sensors/i2c/bme280.yaml
    vars:
      i2c_address: 0x76

  sgp30: !include
    file: ../../../../sensors/i2c/sgp30.yaml
    vars:
      i2c_address: 0x58
      humidity: ${device_internal_name}_bme280_humidity
      temperature: ${device_internal_name}_bme280_temperature_c

  sps30: !include
    file: ../../../../sensors/i2c/sps30.yaml
    vars:
      i2c_address: 0x69

  hc_sr501: !include
    file: ../../../../sensors/binary/hc_sr501.yaml
    vars:
      pin: GPIO1

  ld2410c: !include
    file: ../../../../sensors/uart/hlk_ld2410c_minimal.yaml
    vars:
      presence_pin: GPIO0
      uart_port: ${device_internal_name}_uart_bus1

################################################################################
# ESPHome Overrides / Project Metadata
################################################################################
esphome:
  min_version: 2026.7.0
  comment: HAZA Room Sense Max C6 combined sensor bring-up

  project:
    name: haza.room_sense_max
    version: 2026.0.0

################################################################################
# Remove Or Override Package Defaults
################################################################################
status_led: !remove
spi: !remove

################################################################################
# Add Custom Peripherals
################################################################################
uart:
  id: ${device_internal_name}_uart_bus1
  tx_pin: GPIO3
  rx_pin: GPIO4
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

################################################################################
# Add Custom Sensors
################################################################################
binary_sensor:
  - platform: template
    id: ${device_internal_name}_occupancy
    name: Room Occupancy
    icon: mdi:account-check
    device_class: occupancy
    lambda: |-
      return id(${device_internal_name}_ld2410_gpio_presence).state ||
             id(${device_internal_name}_movement).state;

################################################################################
# Add Custom Local Logic
################################################################################
# Add custom local logic here when it belongs to this project rather than a
# reusable package.
