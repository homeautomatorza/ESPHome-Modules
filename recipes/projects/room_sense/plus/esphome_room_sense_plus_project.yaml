################################################################################
# Room Sense Plus Project
################################################################################
# Author: Pascal Parent
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/recipes/projects/room_sense/plus/README.md
# Version: 2026.0.1 (file/documentation revision; runtime project version unchanged)
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# ------------------------------------------------------------------------------
# WARNING:
# This code carries an "It works on my setup" disclaimer.
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.10.0 (frozen recipe, 2026-11-07);
#       historical ESPHome 2026.7.3 validation retained in documents/validation.md
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Private C3/ENS160 production device, 2026-11-07
#     - Production firmware: ESPHome 2026.10.1; project metadata 2026.0.0
#     - Validation status: ENS160 recipe passed compile, OTA upload, and web
#       and Home Assistant visual confirmation
# ------------------------------------------------------------------------------
# Bill of Materials:
#     - Board:
#         - ESP32-C3 Super Mini
#     - Sensors:
#         - BH1750 illuminance sensor on I2C address 0x23
#         - AHT20 temperature and humidity sensor on I2C address 0x38
#         - ENS160 VOC, eCO2, and air quality sensor on I2C address 0x53
#     - Services:
#         - WiFi
#         - Encrypted Home Assistant API
#         - OTA
#         - Web server
# ------------------------------------------------------------------------------
# References:
#     - https://esphome.io/
#     - https://esphome.io/components/esp32.html
#     - https://esphome.io/components/sensor/bh1750.html
#     - https://esphome.io/components/sensor/aht10.html
#     - https://esphome.io/components/sensor/ens160.html
# ------------------------------------------------------------------------------
# Usage:
#   This C3/ENS160 release pins shared packages to the production-tested Git
#   revision below. Copy the YAML into your ESPHome configuration folder and
#   supply its secret bindings locally. Do not change the pin for this release.
# ------------------------------------------------------------------------------
# This project exposes:
#   - room temperature and humidity
#   - room illuminance
#   - ENS160 eCO2, TVOC, and air quality readings
#   - standard WiFi, API, OTA, web server, uptime, status, and diagnostic
#     entities from the shared framework packages
################################################################################

################################################################################
# Substitutions
################################################################################
substitutions:
  device_internal_name: haza_room_sense_plus
  device_wifi_name: haza-room-sense-plus
  device_friendly_name: Room Sense Plus
  device_sampling_time: 30s
  github_url: https://github.com/homeautomatorza/ESPHome-Modules
  github_ref: 79c989b279b55249b76417bd184105343a8d5798
  github_refresh: 1d

################################################################################
# Packages
################################################################################
packages:
  # Board package
  board:
    url: ${github_url}
    ref: ${github_ref}
    file: boards/esp32/c3_super_mini.yaml
    refresh: ${github_refresh}

  # Core packages
  settings:
    url: ${github_url}
    ref: ${github_ref}
    file: common/core/settings.yaml
    refresh: ${github_refresh}
  time:
    url: ${github_url}
    ref: ${github_ref}
    file: common/time/home_assistant.yaml
    refresh: ${github_refresh}

  # Network packages
  wifi_base:
    url: ${github_url}
    ref: ${github_ref}
    file: common/network/wifi.yaml
    refresh: ${github_refresh}
  wifi_dynamic:
    url: ${github_url}
    ref: ${github_ref}
    file: common/network/wifi_dynamicip.yaml
    refresh: ${github_refresh}
  webserver:
    url: ${github_url}
    ref: ${github_ref}
    file: common/network/webserver.yaml
    refresh: ${github_refresh}

  # Sensor packages
  bh1750:
    url: ${github_url}
    ref: ${github_ref}
    refresh: ${github_refresh}
    files:
      - path: sensors/i2c/bh1750.yaml
        vars:
          i2c_address: 0x23

  aht20:
    url: ${github_url}
    ref: ${github_ref}
    refresh: ${github_refresh}
    files:
      - path: sensors/i2c/aht2x_3x.yaml
        vars:
          i2c_address: 0x38

  ens160:
    url: ${github_url}
    ref: ${github_ref}
    refresh: ${github_refresh}
    files:
      - path: sensors/i2c/ens160.yaml
        vars:
          i2c_address: 0x53

################################################################################
# ESPHome Overrides / Project Metadata
################################################################################
esphome:
  min_version: 2026.7.0
  comment: Room Sense Plus project

  project:
    name: haza.room_sense_plus
    version: 2026.0.0

################################################################################
# Remove Or Override Package Defaults
################################################################################
status_led: !remove
uart: !remove
spi: !remove

################################################################################
# Add Custom Peripherals
################################################################################
# Add custom peripheral YAML here when a reusable package is not viable.

################################################################################
# Add Custom Sensors
################################################################################
# Add custom sensor YAML here when a reusable package is not viable.

################################################################################
# Add Custom Local Logic
################################################################################
# Add custom local logic here when it belongs to this project rather than a
