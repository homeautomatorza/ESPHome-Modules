################################################################################
# HAZA Room Sense Plus Project
################################################################################
# Author: Pascal Parent
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/recipes/projects/room_sense/plus/README.md
