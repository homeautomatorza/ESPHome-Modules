################################################################################
# HAZA Room Sense Plus Project - SGP30 Alternate
################################################################################
# Author: Pascal Parent
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/recipes/projects/room_sense/plus/README.md
# Version: 2026.0.0
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# ------------------------------------------------------------------------------
# WARNING:
# This code carries an "It works on my setup" disclaimer.
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.7.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Private validation device, 2026-08-17
#     - Validation status: Hardware validated alternate
# ------------------------------------------------------------------------------
# Bill of Materials:
#     - Board:
#         - ESP32-C6 Super Mini
#     - Sensors:
#         - BH1750 illuminance sensor on I2C address 0x23
#         - BME280 temperature, humidity, pressure, and dew point sensor on
#           I2C address 0x76
#         - SGP30 eCO2 and TVOC sensor on I2C address 0x58
#     - Services:
#         - WiFi
#         - Encrypted Home Assistant API
#         - OTA
#         - Web server
# ------------------------------------------------------------------------------
# References:
#     - https://esphome.io/
#     - https://esphome.io/components/esp32.html
#     - https://esphome.io/components/sensor/bh1750.html
#     - https://esphome.io/components/sensor/bme280.html
#     - https://esphome.io/components/sensor/sgp30.html
# ------------------------------------------------------------------------------
# Usage:
#   Compile this project from its recipe folder inside the repository. If you
#   copy only this YAML file into an ESPHome root folder, adjust the package
#   paths to match the new location before compiling.
# ------------------------------------------------------------------------------
# This alternate project exposes:
#   - room temperature, humidity, pressure, and dew point from BME280
#   - room illuminance from BH1750
#   - SGP30 eCO2 and TVOC readings with BME280 compensation
#   - standard WiFi, API, OTA, web server, uptime, status, and diagnostic
#     entities from the shared framework packages
################################################################################

################################################################################
# Substitutions
################################################################################
substitutions:
  device_internal_name: haza_room_sense_plus_alternate
  device_wifi_name: haza-room-sense-plus-alt
  device_friendly_name: HAZA Room Sense Plus Alternate
  device_sampling_time: 30s

################################################################################
# Packages
################################################################################
packages:
  # Board package
  board: !include ../../../../boards/esp32/c6_super_mini.yaml

  # Core packages
  settings: !include ../../../../common/core/settings.yaml
  time: !include ../../../../common/time/home_assistant.yaml

  # Network packages
  wifi_base: !include ../../../../common/network/wifi.yaml
  wifi_dynamic: !include ../../../../common/network/wifi_dynamicip.yaml
  webserver: !include ../../../../common/network/webserver.yaml

  # Sensor packages
  bh1750: !include
    file: ../../../../sensors/i2c/bh1750.yaml
    vars:
      i2c_address: 0x23

  bme280: !include
    file: ../../../../sensors/i2c/bme280.yaml
    vars:
      i2c_address: 0x76

  sgp30: !include
    file: ../../../../sensors/i2c/sgp30.yaml
    vars:
      i2c_address: 0x58
      humidity: ${device_internal_name}_bme280_humidity
      temperature: ${device_internal_name}_bme280_temperature_c

################################################################################
# ESPHome Overrides / Project Metadata
################################################################################
esphome:
  min_version: 2026.7.0
  comment: HAZA Room Sense Plus alternate using SGP30

  project:
    name: haza.room_sense_plus_alternate
    version: 2026.0.0

################################################################################
# Remove Or Override Package Defaults
################################################################################
status_led: !remove
uart: !remove
spi: !remove

################################################################################
# Add Custom Peripherals
################################################################################
# Add custom peripheral YAML here when a reusable package is not viable.

################################################################################
# Add Custom Sensors
################################################################################
# Add custom sensor YAML here when a reusable package is not viable.

################################################################################
# Add Custom Local Logic
################################################################################
