################################################################################
# HAZA Weather Sense Air Project
################################################################################
# Author: Pascal Parent
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/recipes/projects/weather_sense/air/README.md
