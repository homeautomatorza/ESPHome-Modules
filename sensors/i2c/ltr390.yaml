################################################################################
# LTR390 UV Sensor
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   I2C Address to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  ltr390: !include
#    file: sensors/i2c/ltr390.yaml
#    vars:
#      i2c_address: 0x53
# ------------------------------------------------------------------------------
# This package exposes:
#   - sensor entities
#   - text sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/sensors/i2c/ltr390.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/sensor/index.html
# References: https://esphome.io/components/sensor/ltr390.html
# References: https://esphome.io/components/text_sensor/index.html
# References: https://esphome.io/components/text_sensor/template.html
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.6.0 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################
sensor:
  - platform: ltr390
    uv_index:
      id: ${device_internal_name}_ltr390_uv_index
      name: LTR390 UV Index
      state_class: measurement
    uv:
      id: ${device_internal_name}_ltr390_uv
      name: LTR390 UV Sensor
      state_class: measurement
    light:
      id: ${device_internal_name}_ltr390_illuminance
      name: LTR390 Light
      on_value:
        then:
          component.update: ${device_internal_name}_ltr390_illuminance_readable
      device_class: illuminance
      state_class: measurement
      disabled_by_default: true
    ambient_light:
      id: ${device_internal_name}_ltr390_ambient_light
      name: LTR390 Ambient Light
      state_class: measurement
      disabled_by_default: true
    address: ${i2c_address}
    update_interval: ${device_sampling_time}

text_sensor:
  - platform: template
    id: ${device_internal_name}_ltr390_illuminance_readable
    name: LTR390 Illuminance Human Readable
    icon: mdi:sunglasses
    lambda: |-
      float lux = id(${device_internal_name}_ltr390_illuminance).state;
      if (isnan(lux)) {
        return std::string("Waiting For Data");
      }
      if (lux <= 200) {
        return std::string("Dark");
      }
      else if (lux <= 300) {
        return std::string("Dim");
      }
      else if (lux <= 500) {
        return std::string("Ideal");
      }
      else if (lux <= 750) {
        return std::string("Bright");
      }
      else if (lux <= 1000) {
        return std::string("Very Bright");
      }
      else {
        return std::string("Too Bright");
      }
    update_interval: never
