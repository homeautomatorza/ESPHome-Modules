################################################################################
# ENS160 Volatile Organic Compound (VOC) and eCO₂ Sensor
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   I2C Address to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  ens160: !include
#    file: sensors/i2c/ens160.yaml
#    vars:
#      i2c_address: 0x52
# ------------------------------------------------------------------------------
# This package exposes:
#   - sensor entities
#   - text sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/sensors/i2c/ens160.yaml
# Version: 2026.0.1b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/sensor/index.html
# References: https://esphome.io/components/sensor/ens160.html
# References: https://esphome.io/components/text_sensor/index.html
# References: https://esphome.io/components/text_sensor/template.html
# References: https://www.sciosense.com/ens16x-digital-metal-oxide-multi-gas-sensor-family/
# References: https://www.umweltbundesamt.de/en/topics/health/commissions-working-groups/german-committee-on-indoor-air-guide-values
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.6.0 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################
sensor:
  - platform: ens160_i2c
    address: ${i2c_address}
    eco2:
      id: ${device_internal_name}_ens160_eco2
      name: "ENS160 eCO2"
      accuracy_decimals: 1
      icon: mdi:molecule-co2
      state_class: measurement
      device_class: carbon_dioxide
      unit_of_measurement: PPM
      on_value:
        then:
          component.update: ${device_internal_name}_ens160_eco2_classification
    tvoc:
      id: ${device_internal_name}_ens160_tvoc
      name: "ENS160 Total Volatile Organic Compounds"
      accuracy_decimals: 1
      icon: mdi:heat-wave
      state_class: measurement
      device_class: volatile_organic_compounds_parts
      unit_of_measurement: PPB
      on_value:
        then:
          component.update: ${device_internal_name}_ens160_tvoc_classification
    aqi:
      id: ${device_internal_name}_ens160_aqi
      name: "ENS160 Air Quality Index"
      icon: mdi:air-filter
      on_value:
        then:
          component.update: ${device_internal_name}_ens160_aqi_classification
    #compensation:
    #  temperature: ${temperature}
    #  humidity: ${humidity}
    update_interval: ${device_sampling_time}

# Human readable sensors
text_sensor:
  - platform: template
    name: "ENS160 eCO2 Classification"
    id: ${device_internal_name}_ens160_eco2_classification
    icon: "mdi:checkbox-marked-circle-outline"
    lambda: |-
      float eco2 = id(${device_internal_name}_ens160_eco2).state;
      if (isnan(eco2)) {
        return std::string("Waiting For Data");
      }
      if (eco2 < 400) {
        return std::string("Not Available");
      }

      if (eco2 <= 600) {
        return std::string("Excellent");
      }
      else if (eco2 <= 800) {
        return std::string("Good");
      }
      else if (eco2 <= 1000) {
        return std::string("Fair");
      }
      else if (eco2 <= 1500) {
        return std::string("Poor");
      }
      else {
        return std::string("Bad");
      }
    update_interval: never

  - platform: template
    name: "ENS160 TVOC Level"
    id: ${device_internal_name}_ens160_tvoc_classification
    icon: "mdi:checkbox-marked-circle-outline"
    lambda: |-
      float tvoc = id(${device_internal_name}_ens160_tvoc).state;
      if (isnan(tvoc)) {
        return std::string("Waiting For Data");
      }
      if (tvoc < 0) {
        return std::string("Not Available");
      }

      if (tvoc <= 300) {
        return std::string("Low");
      }
      else if (tvoc <= 1000) {
        return std::string("Moderate");
      }
      else if (tvoc <= 3000) {
        return std::string("Elevated");
      }
      else if (tvoc <= 10000) {
        return std::string("High");
      }
      else {
        return std::string("Very High");
      }
    update_interval: never

  - platform: template
    name: "ENS160 Air Quality Rating"
    id: ${device_internal_name}_ens160_aqi_classification
    icon: "mdi:air-filter"
    lambda: |-
      float aqi = id(${device_internal_name}_ens160_aqi).state;
      if (isnan(aqi)) {
        return std::string("Waiting For Data");
      }

      switch ((int) aqi) {
        case 1: return std::string("Excellent");
        case 2: return std::string("Good");
        case 3: return std::string("Moderate");
        case 4: return std::string("Poor");
        case 5: return std::string("Unhealthy");
        default: return std::string("Not Available");
      }
    update_interval: never
