################################################################################
# CCS811 eCO2 and TVOC Air Quality Sensor
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   I2C Address to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  ccs811: !include
#    file: sensors/i2c/ccs811.yaml
#    vars:
#      i2c_address: 0x5A
# ------------------------------------------------------------------------------
# This package exposes:
#   - sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/sensors/i2c/ccs811.yaml
# Version: 2026.0.1b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/sensor/index.html
# References: https://esphome.io/components/sensor/ccs811.html
# References: https://esphome.io/components/sensor/template.html
# ------------------------------------------------------------------------------
# Notes:
#       - Optional temperature and humidity compensation is shown commented out.
#       - Add a measured `baseline` value only after calibrating the physical
#         sensor. Do not use the removed `store_baseline` option.
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.6.0 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################
sensor:
  - platform: ccs811
    eco2:
      id: ${device_internal_name}_ccs811_eco2
      on_value:
        then:
          - component.update: ${device_internal_name}_eco2
      accuracy_decimals: 1
      icon: mdi:molecule-co2
      state_class: measurement
      device_class: carbon_dioxide
      disabled_by_default: true
    tvoc:
      id: ${device_internal_name}_ccs811_tvoc
      on_value:
        then:
          - component.update: ${device_internal_name}_tvoc
      accuracy_decimals: 1
      icon: mdi:heat-wave
      state_class: measurement
      device_class: volatile_organic_compounds_parts
      disabled_by_default: true
    version:
      name: CCS811 Version
      id: ${device_internal_name}_ccs811_version
    address: ${i2c_address}
#    compensation:
#      temperature_source: ${device_internal_name}_temperature
#      humidity_source: ${device_internal_name}_humidity
    update_interval: ${device_sampling_time}

  # eCO2
  - platform: template
    id: ${device_internal_name}_eco2
    name: CCS811 eCO2
    icon: mdi:molecule-co2
    lambda: return id(${device_internal_name}_ccs811_eco2).state;
    state_class: measurement
    device_class: carbon_dioxide
    update_interval: never
    disabled_by_default: true

  # TVOC
  - platform: template
    id: ${device_internal_name}_tvoc
    name: CCS811 TVOC
    icon: mdi:heat-wave
    lambda: return id(${device_internal_name}_ccs811_tvoc).state;
    state_class: measurement
    device_class: volatile_organic_compounds_parts
    update_interval: never
    disabled_by_default: true

