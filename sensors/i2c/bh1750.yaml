################################################################################
# BH1750 Illuminance Sensor
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   I2C Address to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  bh1750: !include
#    file: sensors/i2c/bh1750.yaml
#    vars:
#      i2c_address: 0x23
# ------------------------------------------------------------------------------
# This package exposes:
#   - sensor entities
#   - text sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/sensors/i2c/bh1750.yaml
# Version: 2026.0.1
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/sensor/index.html
# References: https://esphome.io/components/sensor/bh1750.html
# References: https://esphome.io/components/text_sensor/index.html
# References: https://esphome.io/components/text_sensor/template.html
# References: https://www.iso.org/standard/76342.html
# References: https://ies.org/standards/lighting-library/illuminance-selector-faqs/
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Room Sense Basic validation device, 2026-08-02
#     - Hardware revalidated: OTA reinstall after illuminance label update, 2026-08-16
#     - Validation status: Hardware validated
################################################################################
sensor:
  - platform: bh1750
    name: BH1750 Illuminance
    id: ${device_internal_name}_bh1750_illuminance
    icon: mdi:sun-wireless-outline
    address: ${i2c_address}
    on_value:
      then:
        component.update: ${device_internal_name}_bh1750_illuminance_readable
    device_class: illuminance
    state_class: measurement
    update_interval: ${device_sampling_time}

text_sensor:
  - platform: template
    id: ${device_internal_name}_bh1750_illuminance_readable
    name: BH1750 Illuminance Human Readable
    icon: mdi:sunglasses
    lambda: |-
      float lux = id(${device_internal_name}_bh1750_illuminance).state;
      if (isnan(lux)) {
        return std::string("Unknown");
      }

      std::string brightness = "";
      if (lux <= 100) {
        brightness = "Very Low";
      }
      else if (lux <= 200) {
        brightness = "Low";
      }
      else if (lux <= 300) {
        brightness = "Basic";
      }
      else if (lux <= 500) {
        brightness = "General";
      }
      else if (lux <= 750) {
        brightness = "Task";
      }
      else if (lux <= 1000) {
        brightness = "Detailed Task";
      }
      else {
        brightness = "High";
      }
      return brightness;
    update_interval: never
