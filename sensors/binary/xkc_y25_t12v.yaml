################################################################################
# Non-Contact Digital Water Level Sensor
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   GPIO pin to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  xkc_y25_t12v: !include
#    file: sensors/binary/xkc_y25_t12v.yaml
#    vars:
#      pin: GPIO14
# ------------------------------------------------------------------------------
# This package exposes:
#   - binary sensor entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/sensors/binary/xkc_y25_t12v.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/binary_sensor/index.html
# References: https://esphome.io/components/binary_sensor/gpio.html
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.8.1 or newer
#     - Config validated: ESPHome 2026.8.1
#     - Compile validated: ESPHome 2026.8.1
#     - Hardware validated: Hydro Sense Basic validation device, 2026-08-25
#     - Validation status: Hardware validated with a level-shifted SEN0204 /
#       XKC-Y25-T12V sensor on GPIO1. Observed polarity is true = liquid
#       detected and false = no liquid detected.
# ------------------------------------------------------------------------------
# Electrical note:
#     - SEN0204 / XKC-Y25-T12V output high follows the sensor input voltage.
#       Use a level shifter or confirm a 3.3 V-safe output before connecting to
#       an ESP32 GPIO.
# ------------------------------------------------------------------------------
# Runtime note:
#     - The retained light debounce allows quick liquid detection and gives the
#       no-liquid state a short settling delay.
################################################################################
binary_sensor:
  - platform: gpio
    name: Water Level
    id: ${device_internal_name}_water_level
    icon: mdi:hydraulic-oil-level
    pin: ${pin}
    filters:
      - delayed_on: 50ms
      - delayed_off: 1s
