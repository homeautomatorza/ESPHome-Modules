################################################################################
# Sparkfun Anemometer
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the 
#   I2C Address to the appropriate one.
# -----------------------------------------------------------------------------
# packages:
#  sf_anemometer: !include 
#    file: sensors/analogue/sparkfun_anemometer.yaml
#.   vars:
#      pin: GPIO14
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/sensors/analogue/sparkfun_anemometer.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# References: https://esphome.io/components/sensor/ccs811.html 
# ------------------------------------------------------------------------------
# Notes:
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# Use at your own risk.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.6.0 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################
substitutions:
  # WMO-style sustained wind convention: 10-minute mean.
  # With a 5s average sample interval, 120 samples = 10 minutes.
  # Publishing every 12 samples gives a refreshed value roughly once per minute.
  wind_speed_update_interval: 5s
  wind_average_update_interval: 5s
  wind_average_window_size: "120"
  wind_average_send_every: "12"

sensor:
  # Wind Speed
  - platform: pulse_counter
    name: Wind Speed (KPH)
    id: ${device_internal_name}_wind_speed_kph
    icon: mdi:weather-windy
    pin: 
      number: ${pin}
      mode: INPUT_PULLUP
    unit_of_measurement: km/h
    accuracy_decimals: 1
    update_interval: ${wind_speed_update_interval}
    filters:
      - multiply: 0.04
    device_class: wind_speed

  # Wind Speed in MPH (Template Helper)
  - platform: template
    name: Wind Speed (MPH)
    id: ${device_internal_name}_wind_speed_mph
    icon: mdi:weather-windy
    unit_of_measurement: mph
    update_interval: ${wind_speed_update_interval}
    lambda: |-
      return id(${device_internal_name}_wind_speed_kph).state * 0.621371;
    device_class: wind_speed
    disabled_by_default: true

  # Wind Speed in Knots (Template Helper)
  - platform: template
    name: Wind Speed (Knots)
    id: ${device_internal_name}_wind_speed_knots
    icon: mdi:weather-windy
    unit_of_measurement: knots
    update_interval: ${wind_speed_update_interval}
    lambda: |-
      return id(${device_internal_name}_wind_speed_kph).state * 0.539957;
    device_class: wind_speed
    disabled_by_default: true

  # WMO-style 10-minute mean wind speed for Beaufort classification.
  - platform: template
    name: 'Wind Speed Average (KPH)'
    icon: 'mdi:weather-windy'
    id: ${device_internal_name}_wind_speed_average_kph
    lambda: return id(${device_internal_name}_wind_speed_kph).state;
    unit_of_measurement: 'km/h'
    update_interval: ${wind_average_update_interval}
    filters:
      - sliding_window_moving_average:
          window_size: ${wind_average_window_size}
          send_every: ${wind_average_send_every}
          send_first_at: ${wind_average_send_every}
    on_value:
      lambda: |-
        float speed = x;
        auto *text_sensor = id(${device_internal_name}_wind_scale);      

        // Beaufort Scale Logic
        if (speed < 1) {
          text_sensor->publish_state("Calm");
        } else if (speed < 6) {
          text_sensor->publish_state("Light Air");
        } else if (speed < 12) {
          text_sensor->publish_state("Light Breeze");
        } else if (speed < 20) {
          text_sensor->publish_state("Gentle Breeze");
        } else if (speed < 29) {
          text_sensor->publish_state("Moderate Breeze");
        } else if (speed < 39) {
          text_sensor->publish_state("Fresh Breeze");
        } else if (speed < 50) {
          text_sensor->publish_state("Strong Breeze");
        } else if (speed < 62) {
          text_sensor->publish_state("Near Gale");
        } else if (speed < 75) {
          text_sensor->publish_state("Gale");
        } else if (speed < 89) {
          text_sensor->publish_state("Strong Gale");
        } else if (speed < 103) {
          text_sensor->publish_state("Storm");
        } else if (speed < 118) {
          text_sensor->publish_state("Violent Storm");
        } else {
          text_sensor->publish_state("Hurricane Force");
        }

  # WMO-style 10-minute mean wind speed in MPH.
  - platform: template
    name: 'Wind Speed Average (MPH)'
    icon: 'mdi:weather-windy'
    id: ${device_internal_name}_wind_speed_average_mph
    lambda: return id(${device_internal_name}_wind_speed_average_kph).state * 0.621371;
    unit_of_measurement: mph
    update_interval: ${wind_average_update_interval}
    device_class: wind_speed
    disabled_by_default: true

  # WMO-style 10-minute mean wind speed in knots.
  - platform: template
    name: 'Wind Speed Average (Knots)'
    icon: 'mdi:weather-windy'
    id: ${device_internal_name}_wind_speed_average_knots
    lambda: return id(${device_internal_name}_wind_speed_average_kph).state * 0.539957;
    unit_of_measurement: knots
    update_interval: ${wind_average_update_interval}
    disabled_by_default: true
    device_class: wind_speed

text_sensor:
  # Beaufort Output
  - platform: template
    name: Beaufort Wind Scale
    icon: mdi:tailwind
    id: ${device_internal_name}_wind_scale
    update_interval: never
