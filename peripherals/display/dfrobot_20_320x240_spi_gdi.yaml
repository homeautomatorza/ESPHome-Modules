################################################################################
# DFRobot GDI 2.0INCH IPS LCD 320X240 TOUCH DISPLAY WITH MICROSD SLOT
################################################################################
# Usage:
#   Add the following code to package section in the device file changing the
#   GPIO pin.
# -----------------------------------------------------------------------------
# packages:
#     display: !include
#       file: peripherals/display/dfrobot_20_320x240_spi_gdi.yaml
#       vars:
#           cs_pin: GPIO14
#           dc_pin: GPIO25
#           reset_pin: GPIO26
#           backlight_pin: GPIO12
# ------------------------------------------------------------------------------
# This package exposes:
#   - display configuration
#   - output entities
#   - light entities
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/dev/peripherals/display/dfrobot_20_320x240_spi_gdi.yaml
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/display/index.html
# Reference: https://esphome.io/components/display/ili9xxx.html
# Reference: https://esphome.io/components/output/index.html
# Reference: https://esphome.io/components/output/ledc.html
# Reference: https://esphome.io/components/light/index.html
# Reference: https://esphome.io/components/light/monochromatic.html
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.6.0 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################

# -------------------------------------------------------------------------------
# Display
# -------------------------------------------------------------------------------
display:
  - platform: ili9xxx
    id: ${device_internal_name}_display
    model: ST7789V
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    reset_pin: ${reset_pin}
    color_palette: NONE
    dimensions:
      height: 320
      width: 240
    #color_order: rgb
    rotation: 90°
    invert_colors: true

# Display Backlight
output:
  - platform: ledc
    id: ${device_internal_name}_backlight_pwm
    pin: ${backlight_pin}

# Display - Monochromatic dimmable light for the backlight
light:
  - platform: monochromatic
    id: ${device_internal_name}_backlight
    name: "Display Backlight"
    icon: mdi:brightness-7
    restore_mode: ALWAYS_ON
    output: ${device_internal_name}_backlight_pwm
    entity_category: config
