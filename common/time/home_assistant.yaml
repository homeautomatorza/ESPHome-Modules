################################################################################
# Home Assistant Time Component
################################################################################
# Usage:
#   Add the following code to package section in the device file
# -----------------------------------------------------------------------------
# packages:
#   ha-time: !include common/time/home_assistant.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - time source configuration
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Source: https://github.com/homeautomatorza/ESPHome-Modules/blob/main/common/time/home_assistant.yaml
# Version: 2026.0.0
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/time/index.html
# Reference: https://esphome.io/components/time/homeassistant.html
# Notes:
#     - Uses the Home Assistant timezone by default.
#     - Add an explicit timezone only in a device file that must intentionally
#       differ from the Home Assistant server timezone.
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Room Sense Basic validation device, 2026-08-02
#     - Validation status: Hardware validated
################################################################################
time:
  # Get the time from the connected Home Assistant Instance
  - platform: homeassistant
    id: ${device_internal_name}_internal_time
