################################################################################
# WiFi Dynamic IP Component for ESP32
################################################################################
# Usage:
#   Add the following code to package section in the device file
# ------------------------------------------------------------------------------
# packages:
#   wifi: !include common/network/wifi_dynamicip.yaml
# ------------------------------------------------------------------------------
# This package exposes:
#   - WiFi network configuration
# ------------------------------------------------------------------------------
# Author: Pascal Parent
# Company: Home Automator (ZA)
# Web: https://www.youtube.com/@homeautomatorza
# Version: 2026.0.0b
# Licence: CC0 1.0 https://creativecommons.org/publicdomain/zero/1.0/
# Reference: https://esphome.io/components/wifi.html
# ------------------------------------------------------------------------------
# Notes:
#       - Requires the following substitution in the device file:
#           - device_internal_name
#       - Requires the following secrets:
#           - wifi_ssid
#           - wifi_password
#
# If you want to use Improv via BLE add the 2 lines below to your device file
# esp32_improv:
#  authorizer: none #does not require a binary sensor, reduces security
# ------------------------------------------------------------------------------
# WARNING:
# This code carries a "It works on my setup" disclaimer!
# Meaning that it works on my setup but it may not work on yours.
# ------------------------------------------------------------------------------
# Compatibility:
#     - Minimum ESPHome: 2026.6.0
#     - Recommended ESPHome: 2026.7.3 or newer
#     - Config validated: ESPHome 2026.7.3
#     - Compile validated: ESPHome 2026.7.3
#     - Hardware validated: Not yet
#     - Validation status: Needs validation
################################################################################
wifi:
  id: ${device_internal_name}_wifi
  output_power: 8.5dB
  networks:
    - ssid: !secret wifi_ssid
      password: !secret wifi_password

  # Explicitly keep the modern ESPHome 2026.6+ default for ESP8266 and ESP32.
  min_auth_mode: WPA2

  ap:
    ssid: ${device_wifi_name}

  fast_connect: true

  # Prevents wifi ap roaming once connected - Requires ESPHome 2026.1 +
  post_connect_roaming: false
